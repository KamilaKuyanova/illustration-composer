<!doctype html><meta charset=utf8><body style="font:14px sans-serif;background:#eee;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px">
<script>
fetch('/library.json').then(r=>r.json()).then(({objects})=>{
 for(const o of objects) for(const k of ['main','bg']){const v=o[k];
  document.body.insertAdjacentHTML('beforeend',`<div style="background:#fff;padding:4px"><b>${o.id} ${k}</b><svg viewBox="${v.x} ${v.y} ${v.w} ${v.h}" style="width:100%;height:160px">${v.svg}</svg></div>`)}
})
</script>
